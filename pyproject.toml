[project]
name = "projet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "concordancer>=0.1.16",
    "dotenv>=0.9.9",
    "pandas>=3.0.6",
    "praw>=8.0.3",
    "xmltodict>=1.0.4",
]

[project.scripts]
projet = "projet:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
